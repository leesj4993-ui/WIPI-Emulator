name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Build Rust
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: /usr/local/lib/android/sdk/ndk/27.1.12297006/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang
        run: |
          cd rust
          cargo build --release --target aarch64-linux-android -p wipi_android

      - name: Copy native library
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp rust/target/aarch64-linux-android/release/libwipi_android.so android/app/src/main/jniLibs/arm64-v8a/

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WIPI-Emulator-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
